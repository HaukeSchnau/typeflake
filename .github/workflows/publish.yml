# Publishes the package when a commit on main raises its version past what npm has. npm trusts this
# workflow (`npm trust github typeflake --file publish.yml --repository HaukeSchnau/typeflake
# --allow-publish`), so there's no token to store and no approval to give. npm accepts that only
# from GitHub-hosted runners, GitLab.com and CircleCI, which is why this runs here and not on Calder.
# GitHub can't see Calder's results, so the job runs the tests, and `npm publish` builds, which
# type-checks the package. Lint stays with Calder: `.calder/` extends a tsconfig only Calder has.
name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find whether npm has this version
        id: version
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "npm already has $name@$version."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        uses: cachix/install-nix-action@v31

      - if: steps.version.outputs.publish == 'true'
        name: Test and publish
        run: |
          nix develop .#ci --command pnpm install --frozen-lockfile
          nix develop .#ci --command pnpm test
          # npm checks `bin` before prepack builds, and drops it if dist/Cli.js isn't there yet.
          nix develop .#ci --command pnpm build
          # Until 1.0 every release is a prerelease, and npm wants their tag named. latest, so
          # `pnpm add typeflake` gets the newest.
          nix develop .#ci --command npm publish --access public --tag latest
