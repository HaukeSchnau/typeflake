  - "@voidzero-dev/vite-plus-core@8.3.8001"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.8.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0"
  - vite-plus@1.8.0
